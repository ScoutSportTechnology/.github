name: ci

# Self-test for the shared release actions in actions/. Every repo that calls
# them pins a tag of this repo, so a change here ships only when a new tag is cut.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck actions/**/*.sh
        run: shellcheck -x actions/*/*.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: resolve-version tests
        run: actions/resolve-version/resolve-version-test.sh
      - name: promote + publish-release tests
        run: actions/promote/promote-test.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
